name: test_front
description: "Todo List management app."
publish_to: 'none'

version: 1.29.0+59

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  intl: ^0.20.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.0
  geolocator: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# 앱 아이콘: 코럴 배경 + 흰 종이비행기(스플래시와 통일).
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EC6A4C"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#EC6A4C"
    theme_color: "#EC6A4C"
