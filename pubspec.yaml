name: test_front
description: "Todo List management app."
publish_to: 'none'

version: 1.54.0+97

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  http: ^1.2.0
  intl: ^0.20.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.0
  geolocator: ^14.1.2
  native_geofence: ^1.3.1
  share_plus: ^13.3.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/covers/

# 앱 아이콘: 코럴 배경 + 흰 종이비행기(스플래시와 통일).
flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#EC6A4C"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#EC6A4C"
    theme_color: "#EC6A4C"
